<header class="header">
  <div class="header-left">
    <a class="logo" routerLink="/inicio">Golden Thread</a>
  </div>

  <div class="header-right">
    <div class="icon user-icon">
      <span class="icon-symbol">👤</span>

      <div class="user-menu">
        <a (click)="editarUser()">Editar usuario</a>
        <!-- Opciones de administración y ventas -->
        <a routerLink="/productos" *ngIf="rol === 'ADMINISTRADOR' || rol === 'VENDEDOR'">Productos</a>
        <a (click)="paginaEmpresa()" *ngIf="rol === 'ADMINISTRADOR' || rol === 'VENDEDOR'">Empresa</a>
        <!-- Solo mostrar para administradores -->
        <a routerLink="/usuarios" *ngIf="rol === 'ADMINISTRADOR'">Usuarios</a>
        <a (click)="logout()">Cerrar sesión</a>
      </div>
    </div>
  </div>
</header>
<form class="producto-form" (ngSubmit)="editarProducto()" *ngIf="producto">

  <h2>Editar producto</h2>

  <div class="form-group">
    <label>Nombre del producto</label>
    <input
      type="text"
      [(ngModel)]="producto.nombreProducto"
      name="nombreProducto"
      required
    />
  </div>

  <div class="form-group">
    <label>Descripción</label>
    <textarea
      [(ngModel)]="producto.descripcion"
      name="descripcion"
      rows="4"
    ></textarea>
  </div>

  <div class="form-row">

    <div class="form-group">
      <label>Precio</label>
      <input
        type="number"
        [(ngModel)]="producto.precio"
        name="precio"
        required
      />
    </div>

    <div class="form-group">
      <label>Stock</label>
      <input
        type="number"
        [(ngModel)]="producto.stock"
        name="stock"
        required
      />
    </div>

  </div>

  <div class="form-row">

    <div class="form-group">
      <label>Color</label>
      <input
        type="text"
        [(ngModel)]="producto.color"
        name="color"
        required
      />
    </div>

    <div class="form-group">
      <label>Talla</label>
      <select [(ngModel)]="producto.talla" name="talla">
        <option *ngFor="let t of Talla | keyvalue" [ngValue]="t.value">
          {{ t.value }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Categoría</label>
      <select [(ngModel)]="producto.categoria" name="categoria">
        <option *ngFor="let c of CategoriaRopa | keyvalue" [ngValue]="c.value">
          {{ c.value }}
        </option>
      </select>
    </div>

  </div>

  <div class="form-group">
    <label>Imagen</label>
    <input
      type="text"
      [(ngModel)]="producto.imagenProducto"
      name="imagenProducto"
    />
  </div>

  <button type="submit">
    Guardar cambios
  </button>

</form>

<header class="header">
  <div class="header-left">
    <span class="logo">Tienda Ropa</span>
  </div>

  <div class="header-right">
    <!-- Usuario -->
    <div class="icon user-icon">
      <span class="icon-symbol">👤</span>

      <div class="user-menu">
        <a (click)="logout()">Cerrar sesión</a>
        <!-- Opciones de administración y ventas -->
        <a href="#" *ngIf="rol === 'ADMINISTRADOR' || rol === 'VENDEDOR'">Productos</a>
        <!-- Solo mostrar para administradores -->
        <a href="#" *ngIf="rol === 'ADMINISTRADOR'">Usuarios</a>
        <a href="#" *ngIf="rol === 'ADMINISTRADOR'">Empresa</a>
      </div>
    </div>

    <!-- Carrito -->
    <div class="icon">
      <span class="icon-symbol">🛒</span>
    </div>
  </div>
</header>
<main class="content">
  <div class="form-container">
    <h2>Editar vendedor</h2>

    <form (ngSubmit)="guardarDatos()" #form="ngForm">

      <div class="grid">

        <div class="input-group">
          <label>Nombre</label>
          <input
            type="text"
            [(ngModel)]="vendedor.nombre"
            name="nombre"
            required>
        </div>

        <div class="input-group">
          <label>Apellido</label>
          <input
            type="text"
            [(ngModel)]="vendedor.apellido"
            name="apellido"
            required>
        </div>

        <div class="input-group full-width">
          <label>Email</label>
          <input
            type="email"
            [(ngModel)]="vendedor.email"
            name="email"
            required>
        </div>

        <div class="input-group">
          <label>Nueva contraseña</label>

          <input
            type="password"
            [(ngModel)]="vendedor.password"
            name="password"
            (input)="validarPassword()">

          <div class="password-checks">

            <p [class.ok]="tieneMinimo(vendedor.password)">
              ✔ Mínimo 8 caracteres
            </p>

            <p [class.ok]="tieneMayuscula(vendedor.password)">
              ✔ Al menos una mayúscula
            </p>

            <p [class.ok]="tieneMinuscula(vendedor.password)">
              ✔ Al menos una minúscula
            </p>

            <p [class.ok]="tieneNumero(vendedor.password)">
              ✔ Al menos un número
            </p>

            <p [class.ok]="tieneSimbolo(vendedor.password)">
              ✔ Al menos un símbolo
            </p>

          </div>
        </div>

        <div class="input-group">
          <label>Confirmar contraseña</label>

          <input
            type="password"
            [(ngModel)]="vendedor.passwordConfirm"
            name="passwordConfirm"
            (input)="validarPassword()">

          <small
            class="error"
            *ngIf="passwordError">

            {{ passwordError }}

          </small>

        </div>

      </div>

      <button type="submit" class="btn-primary">
        Guardar cambios
      </button>

    </form>
  </div>
</main>

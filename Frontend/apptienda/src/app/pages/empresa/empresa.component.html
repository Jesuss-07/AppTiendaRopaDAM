<header class="header">
  <div class="header-left">
    <span class="logo">Tienda Ropa</span>
  </div>

  <div class="header-right">
    <!-- Usuario -->
    <div class="icon user-icon">
      <span class="icon-symbol">👤</span>

      <div class="user-menu">
        <a (click)="logout()">Cerrar sesión</a>
        <!-- Opciones de administración y ventas -->
        <a href="#" *ngIf="rol === 'ADMINISTRADOR' || rol === 'VENDEDOR'">Productos</a>
        <!-- Solo mostrar para administradores -->
        <a href="#" *ngIf="rol === 'ADMINISTRADOR'">Usuarios</a>
        <a href="/empresa" *ngIf="rol === 'ADMINISTRADOR'">Empresa</a>
      </div>
    </div>
    <!-- Carrito -->
    <div class="icon">
      <span class="icon-symbol">🛒</span>
    </div>
  </div>
</header>
<main class="content">
  <h1>Empresas registradas</h1>
  <div *ngIf="cargando === true" class="cargando">
    Cargando empresas...
  </div>
  <div class="empresa-grid">
    <div class="empresa-card" *ngFor="let empresa of (empresas$ | async)">
      <img [src]="empresa.logoEmpresa || 'https://placehold.co/250x150?text=Sin+logo'">
      <h3>{{ empresa.nombreEmpresa }}</h3>
      <p>{{ empresa.direccionEmpresa }}</p>
    </div>
  </div>
</main>

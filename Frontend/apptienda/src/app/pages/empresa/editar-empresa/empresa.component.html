<header class="header">
  <div class="header-left">
    <span class="logo">Tienda Ropa</span>
  </div>

  <div class="header-right">
    <!-- Usuario -->
    <div class="icon user-icon">
      <span class="icon-symbol">👤</span>

      <div class="user-menu">
        <a (click)="logout()">Cerrar sesión</a>
        <!-- Opciones de administración y ventas -->
        <a href="#" *ngIf="rol === 'ADMINISTRADOR' || rol === 'VENDEDOR'">Productos</a>
        <!-- Solo mostrar para administradores -->
        <a href="#" *ngIf="rol === 'ADMINISTRADOR'">Usuarios</a>
        <a href="/empresa" *ngIf="rol === 'ADMINISTRADOR'">Empresa</a>
      </div>
    </div>
    <!-- Carrito -->
    <div class="icon">
      <span class="icon-symbol">🛒</span>
    </div>
  </div>
</header>
<header class="header">
  <div class="header-left">
    <span class="logo">Tienda Ropa</span>
  </div>

  <div class="header-right">

    <div class="icon user-icon">
      <span class="icon-symbol">👤</span>

      <div class="user-menu">
        <a (click)="logout()">Cerrar sesión</a>

        <a href="#" *ngIf="rol === 'ADMINISTRADOR' || rol === 'VENDEDOR'">
          Productos
        </a>

        <a href="#" *ngIf="rol === 'ADMINISTRADOR'">
          Usuarios
        </a>

        <a href="/empresa" *ngIf="rol === 'ADMINISTRADOR'">
          Empresa
        </a>

      </div>
    </div>

    <div class="icon">
      <span class="icon-symbol">🛒</span>
    </div>

  </div>
</header>
<main class="content">

    <div class="form-container">

        <h2>Editar Empresa</h2>

        <form
            #empresaForm="ngForm"
            (ngSubmit)="actualizarEmpresa()">

            <div class="grid">

                <div class="input-group">
                    <label>Nombre de la empresa</label>

                    <input
                        type="text"
                        name="nombreEmpresa"
                        [(ngModel)]="empresa.nombreEmpresa"
                        placeholder="Ej: ZARA"
                        required>
                </div>


                <div class="input-group">
                    <label>Email de contacto</label>

                    <input
                        type="email"
                        name="emailContacto"
                        [(ngModel)]="empresa.emailContacto"
                        placeholder="ejemplo@gmail.com"
                        required>

                    <small
                        class="error"
                        *ngIf="empresaForm.controls['emailContacto']?.invalid 
                        && empresaForm.controls['emailContacto']?.touched">

                        Introduce un email válido
                    </small>

                </div>


                <div class="input-group">
                    <label>Teléfono de contacto</label>

                    <input
                        type="tel"
                        name="telefonoContacto"
                        [(ngModel)]="empresa.telefonoContacto"
                        placeholder="Ej: 612345678"
                        required>
                </div>


                <div class="input-group">
                    <label>Dirección de la sede</label>

                    <input
                        type="text"
                        name="direccionSede"
                        [(ngModel)]="empresa.direccionSede"
                        placeholder="Ej: HUELVA, C.C. Holea, Local 12"
                        required>
                </div>


                <div class="input-group full-width">

                    <label>Logo empresa</label>

                    <input
                        type="text"
                        name="logoEmpresa"
                        [(ngModel)]="empresa.logoEmpresa"
                        placeholder="https://miempresa.com/logo.png">

                </div>

            </div>

            <button
                class="btn-primary"
                type="submit"
                [disabled]="empresaForm.invalid"
                (click)="actualizarEmpresa()">

                Guardar cambios

            </button>

        </form>

    </div>

</main>

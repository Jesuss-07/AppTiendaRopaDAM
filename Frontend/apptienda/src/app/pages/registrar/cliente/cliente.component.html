<div class="contenedor-principal">

  <div class="container">

    <!-- PANEL IZQUIERDO -->
    <div class="izquierda">

      <div class="logo">
        Logo tienda
      </div>

      <h1>Registro Cliente</h1>

      <p>
        Crea tu cuenta para empezar a comprar.
        <br>
        Completa tus datos personales y dirección.
      </p>

    </div>

    <!-- PANEL DERECHO -->
    <div class="derecha">

      <div class="form-box">

        <h2>Bienvenido Usuario</h2>

        <form (ngSubmit)="onRegistroCliente()">

          <div class="grid">

            <div class="input-group">
              <label>Nombre</label>
              <input type="text" name="nombre" [(ngModel)]="cliente.nombre" required>
            </div>

            <div class="input-group">
              <label>Apellido</label>
              <input type="text" name="apellido" [(ngModel)]="cliente.apellido" required>
            </div>

          </div>

          <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" [(ngModel)]="cliente.email" required>
          </div>

          <div class="input-group">
            <label [class.error]="cliente.password && !validarPassword(cliente.password)">
              Password
            </label>

            <input
              type="password"
              name="password"
              [(ngModel)]="cliente.password"
              required>
          </div>

          <!-- CHECKLIST DE CONTRASEÑA -->

          <div class="password-checks">

            <p [class.ok]="tieneMinimo(cliente.password)">
              ✔ Mínimo 8 caracteres
            </p>

            <p [class.ok]="tieneMayuscula(cliente.password)">
              ✔ Al menos una mayúscula
            </p>

            <p [class.ok]="tieneMinuscula(cliente.password)">
              ✔ Al menos una minúscula
            </p>

            <p [class.ok]="tieneNumero(cliente.password)">
              ✔ Al menos un número
            </p>

            <p [class.ok]="tieneSimbolo(cliente.password)">
              ✔ Al menos un símbolo
            </p>

          </div>

          <div class="input-group">
            <label>Dirección</label>
            <input type="text" name="direccion1" [(ngModel)]="cliente.direccion1" required>
          </div>

          <div class="input-group">
            <label>Dirección 2</label>
            <input type="text" name="direccion2" [(ngModel)]="cliente.direccion2">
          </div>

          <div class="grid">

            <div class="input-group">
              <label>Teléfono</label>
              <input type="tel" name="telefono" [(ngModel)]="cliente.telefono" required>
            </div>

            <div class="input-group cp-small">
              <label>C.P</label>
              <input type="text" name="cp" [(ngModel)]="cliente.cp">
            </div>

          </div>

          <div class="grid">

            <div class="input-group">
              <label>Ciudad</label>
              <input type="text" name="ciudad" [(ngModel)]="cliente.ciudad" required>
            </div>

            <div class="input-group">
              <label>Provincia</label>
              <input type="text" name="provincia" [(ngModel)]="cliente.provincia" required>
            </div>

          </div>

          <div class="input-group">
            <label>País</label>
            <input type="text" name="pais" [(ngModel)]="cliente.pais" required>
          </div>

          <button type="submit" class="btn"
          [disabled]="!validarPassword(cliente.password)"
          [class.disabled]="!validarPassword(cliente.password)">
            Registrarse
          </button>

        </form>

      </div>

    </div>

  </div>

</div>

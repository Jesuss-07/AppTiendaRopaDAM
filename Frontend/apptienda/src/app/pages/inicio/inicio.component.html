<header class="header">
  <div class="header-left">
    <span class="logo">Tienda Ropa</span>

    <nav class="nav">
      <a class="nav-item" href="#">Mujer</a>
      <a class="nav-item" href="#">Hombre</a>
      <a class="nav-item" href="#">Niños</a>
      <a class="nav-item" href="#">Añadir Producto</a>


    </nav>
  </div>

  <div class="header-right">
    <!-- Buscador -->
    <div class="search-container">
      <input type="text" placeholder="Buscar productos..." class="search-input" />
    </div>

    <!-- Usuario -->
    <div class="icon user-icon">
      <span class="icon-symbol">👤</span>

      <div class="user-menu">
        <a (click)="editarUser()">Editar usuario</a>
        <!-- Opciones de administración y ventas -->
        <a routerLink="/producto" *ngIf="rol === 'ADMINISTRADOR' || rol === 'VENDEDOR'">Productos</a>
        <!-- Solo mostrar para administradores -->
        <a href="#" *ngIf="rol === 'ADMINISTRADOR'">Usuarios</a>
        <a routerLink="/empresa" *ngIf="rol === 'ADMINISTRADOR'">Empresa</a>
        <a (click)="logout()">Cerrar sesión</a>
      </div>
    </div>
  </div>
</header>

<main class="content">
  <h2>Productos</h2>
</main>

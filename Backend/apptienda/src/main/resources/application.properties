spring.application.name=apptienda

#Configuracion de la base de datos 
spring.datasource.url=jdbc:mysql://localhost:3306/tiendaropa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Configuracion de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true 											#Muestra las consultas SQL realizadas en consola
spring.jpa.properties.hibernate.format_sql=true 					#Mejora visual para el resultado de las consultas mostradas por la linea de arriba
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
